replicaCount: 1
image:
  repository: ermakov880/devops-project
  tag: a67066bc666c71ba47a6f937b17e393730a114aa
  # IfNotPresent, а не Always: CI деплоит по неизменяемому тегу — git SHA
  # (см. deploy.yaml, шаг "Update values.yaml files with new tag"). Такой тег
  # однозначно определяет содержимое образа, поэтому перепроверять реестр при
  # каждом старте пода незачем. Always добавил бы зависимость от доступности
  # Docker Hub: при недоступности/rate-limit под не стартует, даже если образ
  # уже лежит на ноде. Новый SHA всё равно скачается — его локально нет.
  pullPolicy: IfNotPresent
service:
  type: NodePort
  port: 80          # порт Service внутри кластера
  targetPort: 8080  # порт контейнера: nginx-unprivileged слушает 8080 (см. nginx.conf).
                    # Единственный источник правды — на него ссылаются Deployment,
                    # Service, пробы и NetworkPolicy.
  nodePort: 30081   # порт, по которому будет доступно приложение
# Ingress отключён – используем NodePort
ingress:
  enabled: false
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
# Порт проб намеренно не дублируется — шаблон берёт service.targetPort,
# чтобы номер не мог разъехаться с портом контейнера.
livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 5
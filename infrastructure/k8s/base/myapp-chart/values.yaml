replicaCount: 1
image:
  repository: ermakov880/devops-project
  tag: 736fdd538517bf67ff56a763d74b0f4a709f1996
  # IfNotPresent, а не Always: CI деплоит по неизменяемому тегу — git SHA
  # (см. deploy.yaml, шаг "Update values.yaml files with new tag"). Такой тег
  # однозначно определяет содержимое образа, поэтому перепроверять реестр при
  # каждом старте пода незачем. Always добавил бы зависимость от доступности
  # Docker Hub: при недоступности/rate-limit под не стартует, даже если образ
  # уже лежит на ноде. Новый SHA всё равно скачается — его локально нет.
  pullPolicy: IfNotPresent
service:
  type: NodePort
  port: 80
  nodePort: 30081   # порт, по которому будет доступно приложение
# Ingress отключён – используем NodePort
ingress:
  enabled: false
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
livenessProbe:
  enabled: true
  path: /
  port: 80
  initialDelaySeconds: 30
  periodSeconds: 10
readinessProbe:
  enabled: true
  path: /
  port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
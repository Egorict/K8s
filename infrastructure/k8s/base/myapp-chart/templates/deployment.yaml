apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.archive.enabled }}
  # Том архива — ReadWriteOnce: примонтировать его к двум подам нельзя.
  # При RollingUpdate новый под ждал бы том, который держит старый, и
  # выкладка вставала бы намертво. Recreate гасит старый под первым.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      # nginx не обращается к Kubernetes API — токен ServiceAccount ему не нужен.
      automountServiceAccountToken: false
      # uid 101 — непривилегированный пользователь nginx в образе nginx-unprivileged.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: myapp
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: {{ .Values.service.targetPort }}
        resources:
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.service.targetPort }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
        {{- end }}
        # readOnlyRootFilesystem: true требует писать временные файлы куда-то ещё —
        # nginx-unprivileged использует для этого /tmp.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        {{- if .Values.archive.enabled }}
        # Монтируем ровно в тот путь, где архив лежал внутри образа, —
        # поэтому nginx.conf править не пришлось.
        - name: archive
          mountPath: {{ .Values.archive.mountPath }}
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if .Values.archive.enabled }}
      - name: archive
        persistentVolumeClaim:
          claimName: {{ .Values.archive.claimName }}
      {{- end }}
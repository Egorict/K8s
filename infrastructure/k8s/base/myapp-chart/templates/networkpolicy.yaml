apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: myapp-network-policy
spec:
  podSelector:
    matchLabels:
      app: myapp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Трафик приходит снаружи кластера через NodePort — источник не под, поэтому
    # "from" не указываем: разрешаем на этот порт с любого адреса.
    - ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    # nginx проксирует /api на сервер (DNS разрешён отдельно, политикой
    # allow-dns-egress).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: server
      ports:
        - protocol: TCP
          port: 8080
    # ...и /tb/api на трейдинг-бота: страница /tb лежит в образе клиента,
    # а данные берёт из пода бота через этот же nginx.
    - to:
        - podSelector:
            matchLabels:
              app: tradingbot
      ports:
        - protocol: TCP
          port: 8080

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Postgres не обращается к Kubernetes API — токен ServiceAccount ему не нужен.
      automountServiceAccountToken: false
      # uid/gid 70 — пользователь postgres именно в ALPINE-варианте образа
      # (в Debian-варианте он 999 — не перепутать при смене базового образа).
      # fsGroup обязателен: без него kubelet не сменит владельца тома Longhorn,
      # и непривилегированный процесс не сможет писать в PGDATA. 
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:15-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: "myuser"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "mydb"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            # Пути, куда Postgres пишет вне PGDATA. Нужны из-за
            # readOnlyRootFilesystem: unix-сокет и временные файлы.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - exec psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - exec psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT 1"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
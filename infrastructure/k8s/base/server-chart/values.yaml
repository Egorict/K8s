image:
  repository: ermakov880/devops-project-server
  tag: a67066bc666c71ba47a6f937b17e393730a114aa
  pullPolicy: IfNotPresent

service:
  # ClusterIP: сервер доступен ТОЛЬКО внутри кластера. Снаружи к нему не попасть —
  # трафик идёт через nginx клиента (reverse proxy на /api), а NetworkPolicy
  # дополнительно пускает к серверу только поды с label app: myapp.
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

replicaCount: 1

env:
  - name: PORT
    value: "8080"
  # Добавьте эти переменные:
  - name: DB_HOST
    value: db-service
  - name: DB_PORT
    value: "5432"
  - name: DB_USER
    value: myuser
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: postgres-secret
        key: POSTGRES_PASSWORD
  - name: DB_NAME
    value: mydb
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "server.fullname" . }}-network-policy
  labels:
    {{- include "server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Только клиент имеет право дёргать API сервера напрямую.
    - from:
        - podSelector:
            matchLabels:
              app: myapp
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- if .Values.serviceMonitor.enabled }}
    # Скрейп метрик из неймспейса monitoring. Без этого правила default-deny
    # молча резал бы Prometheus, и таргет вечно висел бы в состоянии Down.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    {{- end }}
  egress:
    # Сервер ходит только в базу (DNS разрешён политикой allow-dns-egress).
    # Наружу в интернет доступа нет — приложению это не нужно.
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432

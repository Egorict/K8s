apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "server.fullname" . }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "server.selectorLabels" . | nindent 8 }}
    spec:
      # Запас на graceful shutdown: SHUTDOWN_GRACE_MS (5s) на вывод из Service
      # + время на добивание активных запросов + страховочный таймер в коде.
      terminationGracePeriodSeconds: 30
      # uid 1000 — пользователь node в образе node:18-alpine (см. USER в dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: {{ .Values.service.port }}
        env:
        {{- toYaml .Values.env | nindent 8 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # liveness смотрит только на живость процесса (/health не трогает БД) —
        # иначе падение Postgres приводило бы к бесконечным рестартам сервера.
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        # readiness проверяет реальную доступность БД (/ready делает SELECT 1).
        # Пока база недоступна, под просто выводится из Service, но не убивается.
        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        # При readOnlyRootFilesystem: true Node всё ещё может писать во временные
        # файлы — даём ему для этого отдельный tmpfs вместо корня контейнера.
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
          
{{- range .Values.bots }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradingbot-{{ .name }}
  labels:
    app: tradingbot
    bot: {{ .name }}
    # Метки ТС и версии — чтобы выбирать поды одной стратегии целиком
    # (-l strategy=breakout) или конкретную версию. В selector их НЕТ:
    # он неизменяем, а добавление метки туда сломало бы обновление
    # существующих Deployment.
    strategy: {{ .strategy }}
    botVersion: {{ .version | default "none" | quote }}
spec:
  # Строго 1: две реплики одной ТС писали бы сделки в один и тот же файл,
  # и статистика превратилась бы в кашу.
  replicas: 1
  # RWO-том нельзя держать двумя подами одновременно: при RollingUpdate новый под
  # ждал бы том, который ещё держит старый, и выкладка вставала бы намертво.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tradingbot
      bot: {{ .name }}
  template:
    metadata:
      labels:
        app: tradingbot
        bot: {{ .name }}
        strategy: {{ .strategy }}
        botVersion: {{ .version | default "none" | quote }}
    spec:
      # Бот не обращается к Kubernetes API — токен ServiceAccount ему не нужен.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # fsGroup нужен, чтобы непривилегированный процесс мог писать на том
        # Longhorn: сам том создаётся с владельцем root.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: {{ toJson .args }}
          env:
            - name: TZ
              value: {{ $.Values.bot.timezone | quote }}
            - name: BOT_DATA_DIR
              value: {{ $.Values.data.mountPath | quote }}
            - name: BOT_WEB
              value: "1"
            - name: BOT_WEB_PORT
              value: {{ $.Values.service.port | quote }}
            # Дублируют --strategy/--version в args: если аргументы когда-нибудь
            # перепишут через values, ТС и версия всё равно останутся теми же.
            - name: BOT_STRATEGY
              value: {{ .strategy | quote }}
            - name: BOT_VERSION
              value: {{ .version | default "" | quote }}
            # Умолчания вкладки «История по месяцам» (bot/backtest.py).
            # Сам по себе прогон не запускается: его дёргают кнопкой в панели
            # или `python run.py backtest`. Эти значения — только то, что
            # подставится в форму запуска.
            - name: BOT_BACKTEST_MONTHS
              value: {{ $.Values.backtest.months | quote }}
            - name: BOT_BACKTEST_SYMBOLS
              value: {{ $.Values.backtest.symbols | quote }}
          ports:
            - name: http
              containerPort: {{ $.Values.service.port }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: {{ $.Values.data.mountPath }}
            # readOnlyRootFilesystem: true — временные файлы писать больше некуда.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ $.Values.resources.requests.cpu }}
              memory: {{ $.Values.resources.requests.memory }}
            limits:
              cpu: {{ $.Values.resources.limits.cpu }}
              memory: {{ $.Values.resources.limits.memory }}
      # Хватает, чтобы дописать журнал по SIGTERM.
      terminationGracePeriodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tradingbot-{{ .name }}-data
        - name: tmp
          emptyDir: {}
{{- end }}

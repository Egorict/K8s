{{- range .Values.bots }}
---
apiVersion: v1
kind: Service
metadata:
  name: tradingbot-{{ .name }}
  labels:
    app: tradingbot
    bot: {{ .name }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: tradingbot
    bot: {{ .name }}
{{- end }}

{{- range .Values.bots }}
---
# Том с журналом одного бота — единственный источник для его вкладки на /tb:
#   /data/state.json  — открытые позиции, статистика, выставленные лимитки
#   /data/trades.csv  — закрытые сделки
#   /data/signals.csv — сработавшие сетапы
#   /data/bot.log     — лог
# У каждой ТС том свой: общий файл сделок смешал бы статистику двух систем.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tradingbot-{{ .name }}-data
  namespace: {{ $.Release.Namespace }}
  labels:
    app: tradingbot
    bot: {{ .name }}
  # Как и у архива клиента: том переживает удаление релиза, иначе ArgoCD
  # снёс бы вместе с чартом всю историю сделок.
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .storage | default "2Gi" }}
  storageClassName: {{ $.Values.data.storageClass }}
{{- end }}

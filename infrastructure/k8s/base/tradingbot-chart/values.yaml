image:
  repository: ermakov880/devops-project-tradingbot
  # Тег проставляет CI (шаг "Update image tags") — неизменяемый git SHA,
  # поэтому pullPolicy: IfNotPresent, как и у остальных чартов.
  #
  # Значение ниже — заглушка, живущая ровно до конца сборки: в том же прогоне
  # CI заменит её на SHA коммита. Руками сюда писать тег не нужно; если в поде
  # ImagePullBackOff на теге bootstrap — значит сборка образа не запускалась,
  # смотри фильтр "bot" в .github/workflows/deploy.yaml.
  tag: 15ac88681b53846edba5aea852712b798495349b
  pullPolicy: IfNotPresent

# Боты. Один под = одна торговая система = свой том с журналом, поэтому
# статистика по каждой ТС остаётся чистой и их можно честно сравнивать.
# Образ у всех один и тот же, различие — ключ --strategy.
#
# Добавить третью ТС = дописать сюда элемент (и роут в apps/client/nginx.conf,
# и вкладку в apps/client/html/tb.html).
bots:
  - name: impulse
    # Строго 1 реплика: две писали бы сделки в один файл, да и PVC
    # ReadWriteOnce второму поду не отдадут.
    strategy: impulse
    args: ["run", "--web", "--strategy", "impulse"]
    storage: 2Gi
  - name: density
    strategy: density
    args: ["run", "--web", "--strategy", "density"]
    storage: 2Gi

service:
  # ClusterIP: снаружи боты не доступны. Страница /tb живёт в nginx клиента,
  # он же проксирует на /tb/api/<бот>/ — то же решение, что и для server-app.
  type: ClusterIP
  port: 8080

data:
  storageClass: longhorn
  mountPath: /data

bot:
  timezone: Europe/Moscow

# На каждого бота. В неймспейсе app действует ResourceQuota, и два бота
# должны в неё влезать вместе с клиентом, сервером и базой.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# Биржа. Единственное исходящее соединение ботов наружу кластера.
exchange:
  port: 443

image:
  repository: ermakov880/devops-project-tradingbot
  # Тег проставляет CI (шаг "Update image tags") — неизменяемый git SHA,
  # поэтому pullPolicy: IfNotPresent, как и у остальных чартов.
  #
  # Значение ниже — заглушка, живущая ровно до конца сборки: в том же прогоне
  # CI заменит её на SHA коммита. Руками сюда писать тег не нужно; если в поде
  # ImagePullBackOff на теге bootstrap — значит сборка образа не запускалась,
  # смотри фильтр "bot" в .github/workflows/deploy.yaml.
  tag: a41c8d41b3692ca487f598bc66d7de00bdde50bc
  pullPolicy: IfNotPresent
# Боты. Один под = одна ТС ОДНОЙ ВЕРСИИ = свой том с журналом. Поэтому
# статистика каждой версии остаётся чистой, а выкладка новой версии не трогает
# работающую старую: это просто ещё один элемент списка, а не замена прежнего.
# Образ у всех один, различаются ключи --strategy и --version.
#
# Имя элемента идёт в имена ресурсов (Deployment/Service/PVC) и в URL панели,
# поэтому: только строчные буквы, цифры и дефис — точка в именах Service
# запрещена. Отсюда breakout-v0-1, а не breakout-v0.1.
#
# КАК ВЫКАТИТЬ НОВУЮ ВЕРСИЮ (старая продолжит работать):
#   1) опишите её в apps/tradingbot/bot/versions.py;
#   2) добавьте сюда элемент, НЕ трогая существующий:
#        - name: breakout-v0-2
#          strategy: breakout
#          version: "0.2"
#          args: ["run", "--web", "--strategy", "breakout", "--version", "0.2"]
#          storage: 2Gi
#   3) добавьте роут в apps/client/nginx.conf и версию в BOTS в
#      apps/client/html/tb.html.
#   Старую версию удаляйте только когда решите, что сравнение закончено —
#   вместе с её PVC (у него resource-policy: keep, ArgoCD сам его не тронет).
#
# storage: 2Gi с большим запасом. trades.csv растёт медленно, а лог ограничен
# 20 МБ (RotatingFileHandler, 4 файла по 5).
# ВАЖНО: уменьшить уже созданный PVC нельзя — Kubernetes запрещает shrink,
# и ArgoCD упрётся в ошибку синка. Менять размер только вместе с удалением PVC.
bots:
  - name: impulse-v0-1
    # Строго 1 реплика: две писали бы сделки в один файл, да и PVC
    # ReadWriteOnce второму поду не отдадут.
    strategy: impulse
    version: "0.1"
    args: ["run", "--web", "--strategy", "impulse", "--version", "0.1"]
    storage: 2Gi
  - name: density-v0-1
    strategy: density
    version: "0.1"
    args: ["run", "--web", "--strategy", "density", "--version", "0.1"]
    storage: 2Gi
  - name: breakout-v0-1
    strategy: breakout
    version: "0.1"
    args: ["run", "--web", "--strategy", "breakout", "--version", "0.1"]
    storage: 2Gi
  - name: breakout-v0-2
    strategy: breakout
    version: "0.2"
    args: ["run", "--web", "--strategy", "breakout", "--version", "0.2"]
    storage: 2Gi
  - name: btc-v0-1
    strategy: btc
    version: "0.1"
    args: ["run", "--web", "--strategy", "btc", "--version", "0.1"]
    storage: 2Gi
service:
  # ClusterIP: снаружи боты не доступны. Страница /tb живёт в nginx клиента,
  # он же проксирует на /tb/api/<бот>/ — то же решение, что и для server-app.
  type: ClusterIP
  port: 8080
data:
  storageClass: longhorn
  mountPath: /data
bot:
  # Часовой пояс во времени сделок, логов и state.json. Asia/Yekaterinburg —
  # это ровно UTC+5 круглый год, без перехода на летнее время.
  # (Europe/Moscow, стоявший здесь раньше, — UTC+3.)
  timezone: Asia/Yekaterinburg
# На каждого бота. В неймспейсе app действует ResourceQuota, и все боты
# должны в неё влезать вместе с клиентом, сервером и базой: при четырёх ботах
# это 850m/1152Mi запросов при квоте 1500m/1.5Gi.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
# Биржа. Единственное исходящее соединение ботов наружу кластера.
exchange:
  port: 443

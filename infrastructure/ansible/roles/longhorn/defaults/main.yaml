---
# Версия чарта запинена: без неё каждый прогон мог бы подтянуть новый мажор
# Longhorn и незаметно мигрировать хранилище.
longhorn_chart_version: "1.12.0"
longhorn_namespace: longhorn-system

# 1 реплика — вынужденно, пока нода одна. При добавлении нод поднимите до 2-3:
# именно репликация даёт Longhorn смысл и защищает от faulted-томов.
longhorn_replica_count: 1

# Резерв диска: сколько Longhorn держит про запас и не отдаёт под тома.
# Пинуем явно, чтобы значение не менялось вместе с дефолтом чарта.
# Настройка применяется к диску в момент его ЗАВЕДЕНИЯ; на живом узле правится
# полем spec.disks.<диск>.storageReserved в nodes.longhorn.io.
longhorn_storage_reserved_percentage: 10

# Порог "мало места": если свободного на диске меньше этой доли ОТ РАЗМЕРА
# ДИСКА, Longhorn ставит диску DiskPressure и перестаёт планировать на него
# реплики — новые тома молча уходят в faulted, а под встаёт с невнятным
# "volume is not ready for workloads" (именно так слегли оба бота 07.09.2026:
# 7.86G свободных из 32.63G = 24.1% при дефолтном пороге 25%).
#
# Тогда порог временно опускали до 15%, но 08.09.2026 диск расширили с 31G до
# 58G (свободно ~36G, 60% — с большим запасом), и мера больше не нужна.
# Держим дефолтные 25%: это защита от того, чтобы Longhorn забил корень под
# завязку и уронил заодно kubelet. Опускать ниже — только как временный костыль
# и с пониманием, чем это грозит.
#
# В отличие от резерва, настройка глобальная и применяется сразу — на живом
# кластере правится так:
#   kubectl -n longhorn-system patch settings.longhorn.io \
#     storage-minimal-available-percentage --type=merge -p '{"value":"25"}'
longhorn_storage_minimal_available_percentage: 25

# Разрушительный полный сброс. Только по явному запросу — сносит тома вместе с данными.
longhorn_force_reset: false

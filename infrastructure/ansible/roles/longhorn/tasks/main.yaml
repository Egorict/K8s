---
- name: Install Longhorn node dependencies
  ansible.builtin.package:
    name:
      - open-iscsi
      - nfs-common
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Ensure iscsid is running and enabled
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: yes

# Аварийный полный снос. Модулями это не выражается: нужно снимать финализаторы
# и форсировать удаление namespace — сугубо императивная операция, поэтому
# осознанно оставлена на shell. Выполняется ТОЛЬКО по явному флагу.
- name: Force cleanup Longhorn (webhooks + CRDs + resources + namespace)
  ansible.builtin.shell: |
    kubectl delete validatingwebhookconfiguration longhorn-webhook-validator --ignore-not-found --timeout=10s 2>/dev/null || true
    kubectl delete mutatingwebhookconfiguration longhorn-webhook-mutator --ignore-not-found --timeout=10s 2>/dev/null || true

    for crd in $(kubectl get crd -o name | grep longhorn.io); do
      kubectl patch $crd -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
      kubectl delete $crd --ignore-not-found --wait=false --timeout=10s 2>/dev/null || true
    done

    for resource in $(kubectl api-resources --verbs=list --namespaced -o name | grep -E 'longhorn|volume|engine|replica'); do
      for item in $(kubectl get -n {{ longhorn_namespace }} $resource -o name 2>/dev/null); do
        kubectl patch -n {{ longhorn_namespace }} $item -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
        kubectl delete -n {{ longhorn_namespace }} $item --ignore-not-found --wait=false --timeout=10s 2>/dev/null || true
      done
    done

    kubectl patch namespace {{ longhorn_namespace }} -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
    timeout 30 kubectl delete namespace {{ longhorn_namespace }} --force --grace-period=0 2>/dev/null || true

    for i in $(seq 1 20); do
      kubectl get namespace {{ longhorn_namespace }} >/dev/null 2>&1 || break
      sleep 1
    done
  failed_when: false
  changed_when: true
  when: longhorn_force_reset | bool

- name: Add Longhorn Helm repository
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io

# helm_info вместо парсинга вывода helm status: возвращает структуру, с которой
# можно работать напрямую, без grep по stdout.
- name: Check current Longhorn release state
  kubernetes.core.helm_info:
    name: longhorn
    release_namespace: "{{ longhorn_namespace }}"
  register: longhorn_release
  failed_when: false

# Guard от ловушки Helm "has no deployed releases": прерванная первая установка
# оставляет релиз в статусе failed, из которого upgrade выбраться не может.
- name: Remove broken Longhorn release before install
  kubernetes.core.helm:
    name: longhorn
    release_namespace: "{{ longhorn_namespace }}"
    state: absent
    wait: false
  when:
    - longhorn_release.status is defined
    - longhorn_release.status.status is defined
    - longhorn_release.status.status != 'deployed'

# Модуль сам сравнивает желаемое состояние с текущим и сообщает changed только
# при реальном изменении — отпадают самописные changed_when по выводу helm.
- name: Install Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_chart_version }}"
    release_namespace: "{{ longhorn_namespace }}"
    create_namespace: true
    values:
      persistence:
        defaultClass: true
        defaultClassReplicaCount: "{{ longhorn_replica_count }}"
    wait: true
    wait_timeout: 25m0s
    atomic: true

- name: Verify Longhorn StorageClass exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: longhorn
  register: longhorn_sc

- name: Report Longhorn readiness
  ansible.builtin.assert:
    that: longhorn_sc.resources | length > 0
    success_msg: "Longhorn готов. Используйте storageClassName: longhorn"
    fail_msg: "Longhorn установлен, но StorageClass 'longhorn' не появился"

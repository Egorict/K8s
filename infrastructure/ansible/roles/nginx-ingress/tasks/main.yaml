---
- name: Add Ingress NGINX Helm repository
  kubernetes.core.helm_repository:
    name: ingress-nginx
    repo_url: https://kubernetes.github.io/ingress-nginx

- name: Install NGINX Ingress Controller
  kubernetes.core.helm:
    name: ingress-nginx
    chart_ref: ingress-nginx/ingress-nginx
    chart_version: "{{ ingress_nginx_version }}"
    release_namespace: "{{ ingress_nginx_namespace }}"
    create_namespace: true
    values:
      controller:
        service:
          type: "{{ ingress_nginx_service_type }}"
          nodePorts:
            http: "{{ ingress_nginx_http_port }}"
            https: "{{ ingress_nginx_https_port }}"
        ingressClassResource:
          enabled: true
          default: true
    wait: true
    wait_timeout: 10m0s
    atomic: true

- name: Show Ingress Controller access info
  ansible.builtin.debug:
    msg: >-
      Ingress Controller готов.
      HTTP: {{ ingress_nginx_http_port }}, HTTPS: {{ ingress_nginx_https_port }}

---
# Ключ и репозиторий привязаны к kubernetes_version. Раньше здесь стоял
# `creates:`, из-за которого смена версии в playbook.yaml не приводила НИ К ЧЕМУ:
# репозиторий молча оставался старым. Теперь оба ресурса пересобираются, если
# версия изменилась, и apt-кеш обновляется только по факту изменения.
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Fetch Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
    force: yes          # URL зависит от версии — надо перекачивать и сверять
    timeout: 30
  register: k8s_key

- name: Dearmor Kubernetes apt signing key
  ansible.builtin.command:
    cmd: >-
      gpg --batch --yes --dearmor
      -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      /etc/apt/keyrings/kubernetes-apt-keyring.asc
  when: k8s_key.changed

- name: Configure Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /\n"
    mode: '0644'
  register: k8s_repo

- name: Refresh apt cache after repository change
  ansible.builtin.apt:
    update_cache: yes
  when: k8s_key.changed or k8s_repo.changed

- name: Install kubeadm, kubelet, kubectl
  apt:
    name:
      - kubeadm
      - kubelet
      - kubectl
    state: present
    update_cache: yes
    cache_valid_time: 3600  # кешируем apt на 1 час

- name: Initialize cluster
  shell: |
    kubeadm init --pod-network-cidr={{ pod_network_cidr }} --cri-socket unix:///run/containerd/containerd.sock
  args:
    creates: /etc/kubernetes/admin.conf

# Явно включаем kubelet в автозапуск. Обычно это делает deb-пакет/kubeadm, но в
# воспроизводимом провижининге на это полагаться нельзя. kubelet при загрузке
# читает /etc/kubernetes/manifests/ и поднимает control-plane (etcd, apiserver,
# controller-manager, scheduler), а тот дальше — все рабочие поды.
- name: Ensure kubelet is enabled and running (survives reboot)
  systemd:
    name: kubelet
    enabled: yes
    state: started
    daemon_reload: yes

# На single-node кластере control-plane нода ОБЯЗАНА принимать рабочие нагрузки,
# иначе поды висят Pending (нет worker-нод). Снимаем тейнт, который kubeadm вешает
# по умолчанию. При переходе на multi-node выставьте single_node=false в playbook.yaml,
# чтобы нагрузки шли на worker-ноды, а не на control-plane.
- name: Remove control-plane taint (single-node cluster only)
  shell: |
    kubectl --kubeconfig /etc/kubernetes/admin.conf taint nodes --all \
      node-role.kubernetes.io/control-plane- --overwrite 2>/dev/null || true
  register: taint_removal
  changed_when: "'untainted' in taint_removal.stdout"
  when: single_node | default(true) | bool

- name: Create .kube directory for root
  file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy admin.conf to root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    owner: root
    group: root
    mode: '0600'

- name: Create .kube directory for user
  file:
    path: "/home/{{ user_name }}/.kube"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0755'

- name: Copy admin.conf to user's home
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ user_name }}/.kube/config"
    remote_src: yes
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: '0600'

- name: Set KUBECONFIG for user in .bashrc
  lineinfile:
    path: "/home/{{ user_name }}/.bashrc"
    line: 'export KUBECONFIG=/home/{{ user_name }}/.kube/config'
    create: yes
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
---
# Модули kubernetes.core (helm, k8s, helm_repository) работают через Python-клиент
# Kubernetes на целевой машине. Без него они падают с "Failed to import the
# required Python library". Ставим до всех ролей, которые их используют.
- name: Install Python Kubernetes client for kubernetes.core modules
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-yaml
    state: present
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Check if swap is enabled
  command: swapon --show
  register: swap_status
  changed_when: false
  failed_when: false

- name: Disable swap
  command: swapoff -a
  when: swap_status.stdout != ""

- name: Remove swap from fstab
  replace:
    path: /etc/fstab
    regexp: '^.*swap.*$'
    replace: ''
  when: swap_status.stdout != ""

# Персистим модули: /etc/modules-load.d/*.conf systemd загружает при каждом boot.
# Без этого overlay/br_netfilter грузятся только на текущую сессию и после
# перезагрузки VM пропадают → ломается сеть подов (не применяется bridge sysctl).
- name: Persist kernel modules across reboots
  copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      overlay
      br_netfilter

- name: Load kernel modules (current session)
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  when: ansible_facts['os_family'] == "Debian"

- name: Apply sysctl parameters for Kubernetes
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/k8s.conf
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: 1 }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: 1 }
    - { name: net.ipv4.ip_forward, value: 1 }

- name: Create directory for persistent volume
  file:
    path: /mnt/data
    state: directory
    owner: root
    group: root
    mode: '0755'
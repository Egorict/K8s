---
# Аварийный полный снос ArgoCD, включая cluster-scoped ресурсы и CRD.
# Императивная операция — осознанно оставлена на shell. Только по явному флагу.
- name: Force cleanup ArgoCD (release + namespace + CRDs + cluster roles)
  ansible.builtin.shell: |
    helm uninstall argocd -n {{ argocd_namespace }} --ignore-not-found 2>/dev/null || true
    kubectl delete namespace {{ argocd_namespace }} --ignore-not-found=true 2>/dev/null || true
    kubectl delete crd applications.argoproj.io applicationsets.argoproj.io appprojects.argoproj.io --ignore-not-found=true 2>/dev/null || true
    kubectl delete clusterrole -l app.kubernetes.io/part-of=argocd --ignore-not-found=true 2>/dev/null || true
    kubectl delete clusterrolebinding -l app.kubernetes.io/part-of=argocd --ignore-not-found=true 2>/dev/null || true
    sleep 2
  failed_when: false
  changed_when: true
  when: argocd_force_reset | bool

- name: Add ArgoCD Helm repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Check current ArgoCD release state
  kubernetes.core.helm_info:
    name: argocd
    release_namespace: "{{ argocd_namespace }}"
  register: argocd_release
  failed_when: false

# Guard от ловушки Helm "has no deployed releases": прерванная первая установка
# оставляет релиз в статусе failed, из которого upgrade выбраться не может.
# CRD при удалении релиза не трогаются, поэтому объекты Application выживают.
- name: Remove broken ArgoCD release before install
  kubernetes.core.helm:
    name: argocd
    release_namespace: "{{ argocd_namespace }}"
    state: absent
    wait: false
  when:
    - argocd_release.status is defined
    - argocd_release.status.status is defined
    - argocd_release.status.status != 'deployed'

- name: Install ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    values:
      server:
        service:
          type: NodePort
          nodePortHttp: "{{ argocd_nodeport_http }}"
          nodePortHttps: "{{ argocd_nodeport_https }}"
    wait: true
    wait_timeout: 15m0s
    atomic: true

# Единственная точка, где Ansible трогает приложения: корневой Application
# (app-of-apps). Дальше ArgoCD администрирует себя сам через git.
- name: Bootstrap root Application (app of apps)
  kubernetes.core.k8s:
    state: present
    src: "{{ playbook_dir }}/../k8s/argocd/root-app.yaml"

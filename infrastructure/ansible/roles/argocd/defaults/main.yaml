---
# Версия чарта запинена ради воспроизводимости. Учтите: до этого версия НЕ была
# закреплена, то есть любой прогон и так подтягивал последнюю — пин ничего не
# ломает, а делает происходящее предсказуемым.
# Чтобы остаться на текущей версии, посмотрите её через `helm list -n argocd`
# и подставьте сюда.
argocd_chart_version: "10.2.2"
argocd_namespace: argocd

argocd_nodeport_http: 30080
argocd_nodeport_https: 30443

# Разрушительная переустановка — только по явному запросу.
argocd_force_reset: false

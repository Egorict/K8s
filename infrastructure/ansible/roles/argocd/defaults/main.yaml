---
# Пустое значение = ставить последнюю доступную версию.
# Закрепить версию стоит, но подставлять её надо ПРОВЕРЕННОЙ, а не по памяти:
#   helm repo update && helm search repo argo/argo-cd --versions | head
# и вписать нужную строку сюда.
argocd_chart_version: ""
argocd_namespace: argocd

argocd_nodeport_http: 30080
argocd_nodeport_https: 30443

# Разрушительная переустановка — только по явному запросу.
argocd_force_reset: false

# Как часто ArgoCD сам опрашивает git. Дефолт чарта — 180s, отсюда и
# знакомое ожидание в пару минут после пуша. 30s заметно бодрее, но каждый
# цикл реконсиляции нагружает apiserver, а он на этой ноде и так на пределе —
# ниже 30s опускать не стоит.
argocd_reconciliation_timeout: "30s"

# Секрет для GitHub-вебхука. Если задать — ArgoCD синкает МГНОВЕННО по пушу,
# без опроса вообще. Требует настройки вебхука на стороне GitHub, см. README.
# Пустое значение = вебхук не настраивается, работает только опрос выше.
argocd_github_webhook_secret: ""

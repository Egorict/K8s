---
- name: Add Jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io

- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "{{ cert_manager_version }}"
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: true
    values:
      installCRDs: true
    wait: true
    wait_timeout: 10m0s
    atomic: true

# CRD должен быть зарегистрирован в API-дискавери, иначе ClusterIssuer ниже
# упадёт с "no matches for kind" — та же гонка, что была у Calico.
- name: Wait for ClusterIssuer CRD to be established
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: clusterissuers.cert-manager.io
    wait: true
    wait_condition:
      type: Established
      status: "True"
    wait_timeout: 120

- name: Create Let's Encrypt ClusterIssuer
  kubernetes.core.k8s:
    state: present
    template: cluster-issuer.yaml.j2
  vars:
    email: "{{ cert_manager_email }}"

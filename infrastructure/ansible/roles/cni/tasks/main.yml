---
- name: Set kubeconfig path for root
  ansible.builtin.set_fact:
    kubeconfig_path: /root/.kube/config

# Ждём именно API, а не «какой-нибудь ответ»: k8s_info вернёт список нод, только
# когда apiserver реально обслуживает запросы.
- name: Wait for API server to become available
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Node
  register: api_check
  until: api_check.resources is defined
  retries: 30
  delay: 5

# Flannel не поддерживает NetworkPolicy — переходим на Calico. Удаление старого
# CNI императивно по природе (нужно вычистить интерфейсы на ноде), поэтому shell.
- name: Remove Flannel manifest (if previously installed)
  ansible.builtin.shell: |
    kubectl --kubeconfig {{ kubeconfig_path }} delete -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml --ignore-not-found=true 2>/dev/null || true
  changed_when: false
  failed_when: false

- name: Remove stale Flannel CNI config and interfaces
  ansible.builtin.shell: |
    rm -f /etc/cni/net.d/*flannel*
    ip link delete flannel.1 2>/dev/null || true
    ip link delete cni0 2>/dev/null || true
  changed_when: false
  failed_when: false

- name: Download Tigera Calico operator manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/tigera-operator.yaml"
    dest: /tmp/tigera-operator.yaml
    mode: '0644'
    timeout: 30
  register: operator_download
  until: operator_download is succeeded
  retries: 3
  delay: 5

# server_side_apply нужен из-за размера CRD Calico: обычный apply упирается в
# лимит аннотации last-applied-configuration.
- name: Install Tigera Calico operator
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    src: /tmp/tigera-operator.yaml
    server_side_apply:
      field_manager: ansible
      force_conflicts: true

- name: Wait for Tigera operator deployment
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    name: tigera-operator
    namespace: tigera-operator
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 300

# CRD должны быть не просто созданы, а зарегистрированы в API-дискавери
# (condition Established) — иначе следующий шаг падает с "no matches for kind".
- name: Wait for Tigera CRDs to be established
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    wait: true
    wait_condition:
      type: Established
      status: "True"
    wait_timeout: 120
  loop:
    - installations.operator.tigera.io
    - apiservers.operator.tigera.io

# CIDR пула ОБЯЗАН совпадать с --pod-network-cidr из kubeadm init
# (playbook.yaml -> vars.pod_network_cidr), иначе маршрутизация подов сломается.
- name: Configure Calico installation
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      - apiVersion: operator.tigera.io/v1
        kind: Installation
        metadata:
          name: default
        spec:
          calicoNetwork:
            ipPools:
              - cidr: "{{ pod_network_cidr }}"
                encapsulation: VXLANCrossSubnet
                natOutgoing: Enabled
                nodeSelector: all()
      - apiVersion: operator.tigera.io/v1
        kind: APIServer
        metadata:
          name: default
        spec: {}
  register: calico_apply
  until: calico_apply is succeeded
  retries: 6
  delay: 10

- name: Wait for Calico node pods to be ready
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig_path }}"
    kind: Pod
    namespace: "{{ calico_namespace }}"
    label_selectors:
      - k8s-app=calico-node
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 300
  register: calico_wait
  until: calico_wait.resources | default([]) | length > 0
  retries: 10
  delay: 15

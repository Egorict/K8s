---
- name: Add prometheus-community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Render kube-prometheus-stack values
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /tmp/kube-prometheus-stack-values.yaml
    mode: '0600'   # содержит пароль Grafana

- name: Check current kube-prometheus-stack release state
  kubernetes.core.helm_info:
    name: kube-prometheus-stack
    release_namespace: "{{ monitoring_namespace }}"
  register: kps_release
  failed_when: false

# Тот же guard, что в longhorn и argocd: релиз в статусе не-deployed
# блокирует upgrade ошибкой "has no deployed releases".
- name: Remove broken kube-prometheus-stack release before install
  kubernetes.core.helm:
    name: kube-prometheus-stack
    release_namespace: "{{ monitoring_namespace }}"
    state: absent
    wait: false
  when:
    - kps_release.status is defined
    - kps_release.status.status is defined
    - kps_release.status.status != 'deployed'

- name: Install kube-prometheus-stack
  kubernetes.core.helm:
    name: kube-prometheus-stack
    chart_ref: prometheus-community/kube-prometheus-stack
    chart_version: "{{ kube_prometheus_stack_version }}"
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    values_files:
      - /tmp/kube-prometheus-stack-values.yaml
    wait: true
    wait_timeout: 15m0s
    atomic: true

- name: Show Grafana access info
  ansible.builtin.debug:
    msg: >-
      Grafana: http://<node-ip>:{{ grafana_nodeport }} | user: admin |
      пароль задан переменной grafana_admin_password
      {{ '(ВНИМАНИЕ: используется дефолт из defaults/main.yaml — задайте свой через -e)'
         if grafana_admin_password == 'change-me-please' else '' }}

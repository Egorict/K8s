---
- name: Deploy Kubernetes cluster with ArgoCD
  hosts: all
  become: yes
  vars:
    kubernetes_version: "1.28"
    pod_network_cidr: "10.244.0.0/16"
    user_name: "user"
    single_node: true   # single-node: снимаем con rol-plane taint, чтобы нагрузки шедулились.
                        # При добавлении worker-нод поставьте false.

  roles:
    - common
    - containerd
    - kubernetes
    - cni
    - helm
    - longhorn
   #  - cert-manager    ./  
   # - nginx-ingr ess  
    - argocd
    - monitoring

#    - yandex
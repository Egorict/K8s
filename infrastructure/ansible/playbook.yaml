---
- name: Deploy Kubernetes cluster with ArgoCD
  hosts: all
  become: yes
  vars:
    # 1.35 — поддерживаемая ветка (актуальные: 1.34/1.35/1.36). 1.28 была снята
    # с поддержки ещё в 2024: патчи безопасности для неё не выходят.
    # ВНИМАНИЕ: смена этой переменной влияет только на НОВЫЙ кластер. Обновление
    # уже развёрнутого делается отдельной процедурой kubeadm upgrade (см. README).
    kubernetes_version: "1.35"
    pod_network_cidr: "10.244.0.0/16"
    user_name: "user"
    single_node: true   # single-node: снимаем control-plane taint, чтобы нагрузки шедулились.
                        # При добавлении worker-нод поставьте false.

  # Путь к kubeconfig для модулей kubernetes.core и для helm.
  # Именно через окружение, а НЕ через параметр kubeconfig: тот резолвится на
  # контроллере ДО become, то есть от обычного пользователя, который не имеет
  # доступа к /root/.kube/config (права 0600, владелец root).
  environment:
    K8S_AUTH_KUBECONFIG: /root/.kube/config
    KUBECONFIG: /root/.kube/config

  roles:
    - common
    - containerd
    - kubernetes
    - cni
    - helm
    - longhorn
    # cert-manager и nginx-ingress отключены до появления домена —
    # без него выдавать TLS-сертификаты и настраивать Ingress нечему.
    # - cert-manager
    # - nginx-ingress
    - argocd
    - monitoring
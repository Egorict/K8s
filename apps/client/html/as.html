<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Архив скриншотов</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --border: #e2e6ec;
    --text: #12161c;
    --muted: #667085;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 12px rgba(16,24,40,.06);
    /* Родное соотношение сторон скриншота телефона 1080x2400 */
    --phone-ratio: 1080 / 2400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116;
      --surface: #161b22;
      --border: #262d38;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4b8bff;
      --accent-soft: #16243d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: 20px 16px 56px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  header { margin-bottom: 12px; }
  h1 { font-size: 1.35rem; font-weight: 650; letter-spacing: -.02em; }
  .sub { color: var(--muted); font-size: .86rem; margin-top: 3px; }

  .searchbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    padding: 12px 0 12px;
  }
  .field { position: relative; }
  #q {
    width: 100%;
    padding: 13px 44px 13px 15px;
    font: inherit; font-size: 1.02rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  #q:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  #clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px;
    border: 0; border-radius: 8px;
    background: transparent; color: var(--muted);
    font-size: 1.1rem; line-height: 1; cursor: pointer; display: none;
  }
  #clear:hover { background: var(--border); color: var(--text); }
  .count { color: var(--muted); font-size: .84rem; margin-top: 8px; }

  /* Узкие колонки — скриншоты телефона высокие, широкие карточки выглядели бы
     нелепо. На телефоне помещаются две колонки, на десктопе — много. */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  .shot {
    width: 100%;
    aspect-ratio: var(--phone-ratio);
    object-fit: cover;
    object-position: top center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    cursor: zoom-in;
    display: block;
  }

  .empty {
    grid-column: 1 / -1;
    text-align: center; color: var(--muted);
    padding: 48px 16px;
    border: 1px dashed var(--border); border-radius: 14px;
  }
  .empty code {
    display: inline-block;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 7px; font-size: .86rem; margin-top: 10px;
  }

  /* Во весь экран скриншот показывается целиком (contain), без обрезки */
  #lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.9);
    display: none; align-items: center; justify-content: center;
    padding: 16px; cursor: zoom-out;
  }
  #lightbox.on { display: flex; }
  #lightbox img {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Архив скриншотов</h1>
    <div class="sub">Поиск по тексту с картинки</div>
  </header>

  <div class="searchbar">
    <div class="field">
      <input id="q" type="search" autocomplete="off" autofocus
             placeholder="Например: обгон, километров в час, знак…">
      <button id="clear" type="button" title="Очистить" aria-label="Очистить">✕</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <div class="grid" id="results"></div>
</div>

<div id="lightbox"><img alt=""></div>

<script>
(function () {
  const qInput   = document.getElementById('q');
  const clearBtn = document.getElementById('clear');
  const results  = document.getElementById('results');
  const countEl  = document.getElementById('count');
  const lightbox = document.getElementById('lightbox');
  const lightImg = lightbox.querySelector('img');

  let entries = [];

  const norm = (s) => (s || '')
    .toLowerCase()
    .replace(/ё/g, 'е')
    .replace(/\s+/g, ' ')
    .trim();

  const escapeHtml = (s) => {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  };

  function matches(entry, query) {
    const nq = norm(query);
    if (!nq) return true;
    const hay = norm(entry.text);
    // Прямое вхождение — основной случай; пословный разбор выручает, когда
    // OCR вставил мусор между нужными словами.
    if (hay.includes(nq)) return true;
    return nq.split(' ').every((w) => hay.includes(w));
  }

  function render(list, query) {
    if (!entries.length) {
      countEl.textContent = '';
      results.innerHTML =
        '<div class="empty">Архив пуст.<br>Добавьте скриншоты:' +
        '<br><code>node tools/add-entry.js</code></div>';
      return;
    }
    if (!list.length) {
      countEl.textContent = 'Ничего не найдено';
      results.innerHTML =
        '<div class="empty">По запросу ничего не нашлось.<br>' +
        'Попробуйте короче — распознавание не всегда точное.</div>';
      return;
    }
    countEl.textContent = query
      ? `Найдено: ${list.length} из ${entries.length}`
      : `Всего: ${entries.length}`;

    results.innerHTML = list.map((e) => (
      e.screenshot
        ? `<img class="shot" src="${escapeHtml('/as/' + e.screenshot)}" alt="" loading="lazy">`
        : ''
    )).join('');
  }

  function apply() {
    const query = qInput.value;
    clearBtn.style.display = query ? 'block' : 'none';
    render(entries.filter((e) => matches(e, query)), query);
  }

  qInput.addEventListener('input', apply);
  clearBtn.addEventListener('click', () => { qInput.value = ''; qInput.focus(); apply(); });
  qInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { qInput.value = ''; apply(); }
  });

  results.addEventListener('click', (ev) => {
    const img = ev.target.closest('img.shot');
    if (!img) return;
    lightImg.src = img.src;
    lightbox.classList.add('on');
  });
  lightbox.addEventListener('click', () => lightbox.classList.remove('on'));
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') lightbox.classList.remove('on');
  });

  fetch('/as/data.json', { cache: 'no-store' })
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status))))
    .then((data) => {
      entries = Array.isArray(data) ? data : (data.entries || []);
      apply();
    })
    .catch((err) => {
      results.innerHTML =
        '<div class="empty">Не удалось загрузить данные: ' +
        escapeHtml(err.message) + '</div>';
    });
})();
</script>
</body>
</html>

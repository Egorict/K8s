server {
    # 8080, а не 80: образ nginx-unprivileged работает от uid 101, а порты <1024
    # требуют root. Наружу это не влияет — Service мапит 80 -> 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /cs {
        try_files /cs.html =404;
    }

    # Архив "скрин-вопрос-ответ" с поиском.
    # Именно "= /as" (точное совпадение), а НЕ префикс: с префиксом сюда попадали
    # бы и /as/data.json, и /as/screens/*.png — им бы отдавался HTML вместо файла.
    # При точном совпадении всё под /as/ уходит в location / и отдаётся как есть.
    location = /as {
        try_files /as.html =404;
    }
    location = /as/ {
        try_files /as.html =404;
    }

    # Манифест не кешируем: после добавления записей страница должна сразу
    # видеть новые данные, а не отдавать залипший ответ из кеша браузера.
    location = /as/data.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Reverse proxy на сервер внутри кластера. Браузер обращается к тому же origin
    # (клиенту) на /api/..., nginx форвардит запрос на сервер ИЗ пода app: myapp —
    # поэтому NetworkPolicy сервера его пропускает, а CORS не нужен (same-origin).
    # Без завершающего "/" в proxy_pass путь сохраняется: /api/data -> server-app:8080/api/data.
    location /api/ {
        proxy_pass http://server-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
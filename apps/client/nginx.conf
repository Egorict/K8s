server {
    # 8080, а не 80: образ nginx-unprivileged работает от uid 101, а порты <1024
    # требуют root. Наружу это не влияет — Service мапит 80 -> 8080.
    listen 8080;
    server_name _;

    # Редиректы делаем ОТНОСИТЕЛЬНЫМИ (Location: /rwm/ вместо http://host:8080/rwm/).
    # По умолчанию nginx строит абсолютный URL, подставляя порт, на котором сам
    # слушает (8080). Снаружи же обращаются через NodePort 30081, и браузер
    # уезжал на несуществующий 8080. Относительный Location браузер разрешает
    # от исходного адреса, поэтому порт сохраняется.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /cs {
        try_files /cs.html =404;
    }

    # Архив скриншотов с поиском.
    # Именно "= /as" (точное совпадение), а НЕ префикс: с префиксом сюда попадали
    # бы и /as/data.json, и /as/screens/*.png — им бы отдавался HTML вместо файла.
    # При точном совпадении всё под /as/ уходит в location / и отдаётся как есть.
    location = /as {
        try_files /as.html =404;
    }
    location = /as/ {
        try_files /as.html =404;
    }

    # Манифест не кешируем: после добавления записей страница должна сразу
    # видеть новые данные, а не отдавать залипший ответ из кеша браузера.
    location = /as/data.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ---- Unity WebGL (игра ReturnMyEyes) ----
    #
    # Регулярные location проверяются РАНЬШЕ префиксных, поэтому правила для .gz
    # идут первыми по приоритету и перехватывают ассеты до общего /rwm/.
    #
    # Unity кладёт ассеты уже сжатыми (.gz) и рассчитывает, что сервер отдаст их
    # с Content-Encoding: gzip — тогда браузер распакует их сам. Без этого
    # заголовка загрузчик получает бинарный мусор и падает с ошибкой.
    location ~ ^/rwm/Build/.+\.wasm\.gz$ {
        # types {} сбрасывает сопоставление .gz -> application/gzip из mime.types.
        # Без сброса default_type ниже игнорируется: тип уже определён по расширению.
        types { }
        add_header Content-Encoding gzip;
        default_type application/wasm;
    }
    location ~ ^/rwm/Build/.+\.js\.gz$ {
        # types {} сбрасывает сопоставление .gz -> application/gzip из mime.types.
        # Без сброса default_type ниже игнорируется: тип уже определён по расширению.
        types { }
        add_header Content-Encoding gzip;
        default_type application/javascript;
    }
    location ~ ^/rwm/Build/.+\.data\.gz$ {
        # types {} сбрасывает сопоставление .gz -> application/gzip из mime.types.
        # Без сброса default_type ниже игнорируется: тип уже определён по расширению.
        types { }
        add_header Content-Encoding gzip;
        default_type application/octet-stream;
    }

    # Редирект на слэш обязателен: в index.html сборки пути относительные
    # (Build/..., TemplateData/...). Без завершающего слэша браузер разрешал бы
    # их от корня сайта (/Build/...), а не от /rwm/.
    location = /rwm {
        return 301 /rwm/;
    }

    location /rwm/ {
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Reverse proxy на сервер внутри кластера. Браузер обращается к тому же origin
    # (клиенту) на /api/..., nginx форвардит запрос на сервер ИЗ пода app: myapp —
    # поэтому NetworkPolicy сервера его пропускает, а CORS не нужен (same-origin).
    # Без завершающего "/" в proxy_pass путь сохраняется: /api/data -> server-app:8080/api/data.
    location /api/ {
        proxy_pass http://server-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
